name: quality

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: challenge
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      kafka:
        image: confluentinc/cp-kafka:7.7.1
        ports:
          - 9092:9092
        env:
          CLUSTER_ID: challenge-kafka-ci
          KAFKA_NODE_ID: 1
          KAFKA_PROCESS_ROLES: broker,controller
          KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:29093
          KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:29093
          KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
          KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
          KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
          KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
          KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
          KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
          KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
          KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
          KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
        options: >-
          --health-cmd "kafka-broker-api-versions --bootstrap-server localhost:9092"
          --health-interval 10s
          --health-timeout 10s
          --health-retries 10
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/challenge?schema=public
      DATABASE_URL_TEST: postgresql://postgres:postgres@localhost:5432/challenge_test?schema=public
      KAFKA_BROKERS: localhost:9092
      KAFKA_CLIENT_ID: tech-challenge-ci
      KAFKA_GROUP_ID_TRANSACTIONS: transactions-consumer-ci
      KAFKA_GROUP_ID_ANTI_FRAUD: anti-fraud-consumer-ci
      KAFKA_CONNECTION_TIMEOUT_MS: 3000
      KAFKA_REQUEST_TIMEOUT_MS: 30000
      KAFKA_RETRY_INITIAL_TIME_MS: 300
      KAFKA_RETRY_COUNT: 5
      KAFKA_SESSION_TIMEOUT_MS: 30000
      KAFKA_CONSUMER_MAX_ATTEMPTS: 3
      KAFKA_CONSUMER_RETRY_DELAY_MS: 300
      KAFKA_CONSUMER_ENABLED: "false"
      OUTBOX_DISPATCH_ENABLED: "false"
      OUTBOX_POLL_INTERVAL_MS: 1000
      OUTBOX_BATCH_SIZE: 50
      OUTBOX_RETRY_BASE_DELAY_MS: 1000
      OUTBOX_RETRY_MAX_DELAY_MS: 60000
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create test database
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d postgres -c 'CREATE DATABASE challenge_test;'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.25.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Cache Turborepo
        uses: actions/cache@v4
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm --filter @tech-challenge/transactions generate

      - name: Quality gate
        run: pnpm quality
